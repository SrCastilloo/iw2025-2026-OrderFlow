spring.application.name=orderflow

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://localhost:3306/orderflow?useSSL=false&serverTimezone=Europe/Madrid&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.vaadin=DEBUG
vaadin.exclude-urls=/product-photos/**,/company-logos/**,/__static__/**,/images/**,/favicon.ico
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s
orderflow.hash.password=admin
